
name: Update GitHub Stats

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:      # allow manual trigger

permissions:
  contents: write          # required to push commits

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Generate SVG
        run: npx tsx scripts/generate.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push if Changed
        run: |
          # Set up a non-personal commit author
          git config user.name "GitHub Actions"
          git config user.email "no-reply@github.com"  # Non-contributory email

          git add readme.svg colors.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update stats card"
          git push

